server {
    listen 80;
    root /var/www/public;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/vnd.mapbox-vector-tile;
    gzip_min_length 256;

    # add_header se do location nedědí, proto include v každém bloku.
    location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.pbf$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        root /var/www/var/cache;
        default_type application/vnd.mapbox-vector-tile;
        try_files /tiles/$1/$2/$3.pbf @php;
    }

    location /api/ {
        limit_except GET { deny all; }
        try_files /nonexistent @php;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location @php {
        include /etc/nginx/snippets/security-headers.conf;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_hide_header X-Powered-By;
    }
}
